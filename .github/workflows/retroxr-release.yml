# Build the retroXR VeMUlator core for Windows, Android, Linux and macOS and
# publish it as a release, so retroXR's CoreDownloadManager can fetch it.
#
# This fork fixes four faults, each of which takes the process down rather than
# failing:
#
#   * VE_VMS_FLASH::flashWriter is the one member the constructor never
#     initialises, and the destructor closes it behind a guard that therefore
#     tests garbage. retro_unload_game calls reset(), which builds a fresh flash
#     object, so every session died on the way out.
#   * the extension check took the FIRST dot in the path, so on Android -- where
#     a core is handed /data/user/0/<package>/files/... -- it matched nothing and
#     the CPU was started with no ROM loaded.
#   * a path with no dot at all handed NULL to strcmp.
#   * every XRAM access adds STAD to its index, which reaches up to 0xFF past
#     the end of a 0x7C-byte bank. A game that sets STAD corrupts the heap, and
#     the next reset() or unload crashes freeing it.
#
# It has since grown into a VMU that behaves like one: it boots the real BIOS,
# draws the four icons, keeps the flash as save RAM, links two units over the
# serial cable, plays timer 1's buzzer at the rates the hardware manual gives,
# saves and restores its whole state, and can power on to a fixed clock so two
# machines started apart are identical from the first frame.
#
#   Windows  vemulator_libretro.dll.zip          containing vemulator_libretro.dll
#   Android  vemulator_libretro_android.so.zip   containing vemulator_libretro_android.so
#   Linux    vemulator_libretro.so.zip           containing vemulator_libretro.so
#   macOS    vemulator_libretro_arm64.dylib.zip
#            vemulator_libretro_x86_64.dylib.zip
#              each containing vemulator_libretro.dylib
#
# Windows is cross-compiled from Ubuntu with mingw-w64 rather than built with
# MSVC, because that is what the makefile's Windows branch is written for.
#
# The release must NOT be a prerelease: the download URL is the /releases/latest/
# form so shipping a build needs no app update, and GitHub's `latest` skips
# prereleases. Anything else cut on this fork should be marked prerelease.
name: retroXR core release

on:
  push:
    tags:
      - 'retroxr-vemulator-libretro-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true
        default: 'retroxr'
      tag:
        description: 'Release tag to publish as (leave blank to build without publishing)'
        required: false
        default: ''

jobs:
  windows:
    name: Windows x86_64 (mingw-w64)
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 make zip

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # platform=win is passed explicitly and never inferred: the makefile picks
      # its platform from uname, so building for Windows from a Linux host would
      # otherwise silently produce a unix target. CC/CXX are passed because the
      # makefile otherwise calls plain `cc`, which is not what cross-compiles.
      - name: Build
        run: |
          make platform=win \
            CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \
            -j$(nproc)

      - name: Package
        run: |
          mapfile -t hits < <(find . -maxdepth 2 -name 'vemulator_libretro.dll' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one vemulator_libretro.dll, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/vemulator_libretro.dll
          (cd stage && zip -q -X ../vemulator_libretro.dll.zip vemulator_libretro.dll)
          file stage/vemulator_libretro.dll
          ls -lh vemulator_libretro.dll.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: vemulator_libretro.dll.zip
          if-no-files-found: error

  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip
          # Into RUNNER_TEMP, NOT the workspace: this step runs before
          # actions/checkout, and checkout clears the workspace it checks into.
          wget -q -O "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/android-ndk-r27d" >> $GITHUB_PATH

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Application.mk says APP_ABI := all; arm64-v8a is passed on the command
      # line so the run builds the one ABI retroXR ships and not every ABI the
      # NDK knows.
      - name: Build
        run: |
          cd jni
          ndk-build APP_ABI=arm64-v8a -j$(nproc)

      # LOCAL_MODULE is `retro`, so ndk-build emits libretro.so -- a name that
      # says nothing about which core it is. It is renamed on the way into the
      # zip to the name the asset advertises and the installer expects.
      - name: Package
        run: |
          # libs/, not obj/. ndk-build leaves an unstripped copy in
          # obj/local/<abi>/ and INSTALLS the deliverable to libs/<abi>/, so a
          # search for the bare name finds two and the bigger one is the wrong one.
          mapfile -t hits < <(find . -path '*/libs/arm64-v8a/*' -name 'libretro.so' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one arm64-v8a libretro.so, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/vemulator_libretro_android.so
          (cd stage && zip -q -X ../vemulator_libretro_android.so.zip vemulator_libretro_android.so)
          file stage/vemulator_libretro_android.so
          ls -lh vemulator_libretro_android.so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: vemulator_libretro_android.so.zip
          if-no-files-found: error

  # The oldest Ubuntu runner: a shared library loads only against a glibc at
  # least as new as the one it was linked with.
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build
        run: make platform=unix -j$(nproc)

      - name: Package
        run: |
          mapfile -t hits < <(find . -maxdepth 2 -name 'vemulator_libretro.so' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one vemulator_libretro.so, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/vemulator_libretro.so
          (cd stage && zip -q -X ../vemulator_libretro.so.zip vemulator_libretro.so)
          file stage/vemulator_libretro.so
          ls -lh vemulator_libretro.so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: vemulator_libretro.so.zip
          if-no-files-found: error

  # Both architectures on one Apple Silicon runner, with the flags libretro's
  # own osx-arm64 CI template passes: the osx branch of the makefile only
  # applies a target triple and SDK when CROSS_COMPILE=1.
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - arch: arm64
            triple: arm64-apple-macos10.15
          - arch: x86_64
            triple: x86_64-apple-macos10.13
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build
        run: |
          make platform=osx CC=clang CXX=clang++ CROSS_COMPILE=1 \
            LIBRETRO_APPLE_PLATFORM=${{ matrix.triple }} \
            LIBRETRO_APPLE_ISYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          hits=(); while IFS= read -r f; do hits+=("$f"); done < <(find . -maxdepth 2 -name 'vemulator_libretro.dylib' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one vemulator_libretro.dylib, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          lib="${hits[0]}"
          lipo -info "$lib"
          if [ "$(lipo -archs "$lib")" != "${{ matrix.arch }}" ]; then
            echo "$lib is not ${{ matrix.arch }}"
            exit 1
          fi
          mkdir -p stage
          cp "$lib" stage/vemulator_libretro.dylib
          (cd stage && zip -q -X ../vemulator_libretro_${{ matrix.arch }}.dylib.zip vemulator_libretro.dylib)
          ls -lh vemulator_libretro_${{ matrix.arch }}.dylib.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: vemulator_libretro_${{ matrix.arch }}.dylib.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, android, linux, macos]
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -lh dist
          cat > notes.md <<'NOTES'
          VeMUlator libretro core built for retroXR.

          Windows x86_64, Android arm64-v8a, Linux x86_64 and macOS arm64 and
          x86_64. The source for these binaries is this tag.

          Over the stock buildbot build this is a VMU that behaves like one:

          * it boots the real VMU BIOS, and draws the four icons under the
            picture;
          * the flash is exposed as save RAM, so what a game writes survives;
          * two VMUs link over the serial cable, full duplex, which is what
            Chao Adventure's BATTLE and MATING exchange;
          * timer 0 and timer 1 run at the rates the hardware manual gives
            (timer 1 had never overflowed at all), and the frontend is handed a
            whole frame of audio, in tune and centred on zero;
          * save states are implemented -- 134001 bytes, refused if the wrong
            size or version -- so a frontend can snapshot, rewind and netplay;
          * a 'Clock at power-on' option (system|fixed) can seed Saturday
            1 January 2000, so two machines switched on apart are identical from
            the first frame.

          It also fixes four faults, each of which took the process down rather
          than failing:

          * `VE_VMS_FLASH::flashWriter` is the one member the constructor never
            initialises, and the destructor closes it behind a guard that
            therefore tests an indeterminate pointer. `retro_unload_game` calls
            `reset()`, which builds a fresh flash object, so every session died
            on the way out -- not only the ones that had opened a writer.
          * the extension check took the FIRST dot in the path. On Android a
            core is handed `/data/user/0/<package>/files/...`, so it matched
            nothing and the CPU was started with no ROM loaded.
          * a path with no dot at all handed NULL to `strcmp`.
          * every XRAM access adds `STAD` to its index, which reaches up to 0xFF
            past the end of a 0x7C-byte bank. A game that sets `STAD` (Chao
            Adventure 2 does) corrupts the heap, and the next `reset()` or unload
            crashes freeing it.
          NOTES
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VeMUlator (retroXR build) $TAG" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" \
            dist/vemulator_libretro.dll.zip \
            dist/vemulator_libretro_android.so.zip \
            dist/vemulator_libretro.so.zip \
            dist/vemulator_libretro_arm64.dylib.zip \
            dist/vemulator_libretro_x86_64.dylib.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
